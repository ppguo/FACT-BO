[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fas-wca"
version = "0.1.0"
description = "Foundation-model active-subspace workflow for AMS worst-case analysis"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {file = "LICENSE"}
authors = [
  {name = "Nanlin Guo"},
  {name = "Shan Shen"},
  {name = "Jun Tao"},
  {name = "Wei W. Xing"},
]
dependencies = [
  "botorch>=0.13,<0.17",
  "einops>=0.8,<1",
  "huggingface-hub>=0.29,<2",
  "matplotlib>=3.10,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "scipy>=1.12,<2",
  "torch>=2.1,<2.8",
  "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "tabpfn/LICENSE", "tabpfn/NOTICE"]

[tool.setuptools.package-data]
tabpfn = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["."]
include = ["algorithms*", "fas_wca*", "tabpfn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
